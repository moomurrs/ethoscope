# Root level pyproject.toml for the entire Ethoscope project

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "htmlcov",
]

[tool.ruff.lint]
# Add to Ruff's defaults instead of replacing them entirely
extend-select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear (common bug patterns)
    "F",      # Better usage of built-in logging
    "C4",     # flake8-comprehensions (use comprehensions instead of filter/map)
    "UP",     # pyupgrade (modernize syntax for target Python version)
    "SIM",    # flake8-simplify (simplify redundant constructs)
    "ISC",    # Good use of string concatenation (explicit + for string concatenation)
    "RET",    # Good return practices (consistent/unnecessary return statements)
    "RUF",    # Ruff-specific rules (catch-all for Ruff's own lints)
    "PTH",    # pathlib (prefer pathlib over os.path)
    "PL",     # Pylint (rules ported from Pylint)
    "FURB",   # refurb (modernization and simplification suggestions)
    "ASYNC",  # flake8-async (correct asyncio patterns)
    "NPY",    # NumPy-specific rules (numpy deprecations, etc.)
    "TCH",    # (flake8-type-checking) moves type-only imports into TYPE_CHECKING blocks
    "YTT",    # (flake8-2020) flags datetime.utcnow()/utcfromtimestamp() deprecations
    "PT",     # (flake8-pytest-style) standardizes fixture usage and pytest.raises patterns
    "PERF",   # (perflint) flags perf issues (e.g., manual iteration vs max()/min(), dict.get patterns)
    "TRY",    # (tryceratops) enforces good exception handling (raise/return in except)
]
#ignore = [
#    "E501",  # line too long, handled by black
#    "B008",  # do not perform function calls in argument defaults
#    "C901",  # too complex
#]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"**/tests/**/*.py" = ["F401", "F811"]  # Allow unused imports and redefinitions in tests

[tool.ruff.lint.isort]
known-first-party = ["ethoscope", "ethoscope_node"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion="3.12"
typeCheckingMode = "standard"
extraPaths = ["src/ethoscope", "src/node"]
